[package]
name = "market-arb"
version = "0.1.0"
edition = "2021"
description = "Polymarket ↔ Outcome HIP-4 market-order arbitrage service"

[lib]
name = "market_arb"
path = "src/lib.rs"

[[bin]]
name = "market-arb"
path = "src/main.rs"

[dependencies]
alloy-primitives = { version = "1.0", features = ["serde"] }
alloy-signer = "1.0"
alloy-signer-local = "1.0"
anyhow = "1"
async-nats = "0.39"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
dashmap = "6"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmp = "0.8"
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "chrono", "uuid", "rust_decimal", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
